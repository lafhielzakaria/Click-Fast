<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Fast</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="game-container">
        <header class="game-header">
            <a href="home.html" class="home-btn" title="Back to Home">&larr;</a>
            <h1 id="gameName">Click Fast</h1>
            <div class="timer-box">
                Time: <span id="timer">10</span>s
            </div>
        </header>
        <form id="config">
        <p>Config : </p>
        <input required type="text" id="username" placeholder="username">
        <div class="options-menu">
            <label for="time">time</label>
            <select id="gameTime">
                <option value="" disabled selected>Select the time</option>
                <option value="10">10s</option>
                <option value="7">7s</option>
                <option value="4">4</option>
            </select>
        </div>
        <div class="options-menu">
            <label for="boardSize">Board Size:</label>
            <select id="boardSize">
                <option value="" disabled selected>Select the board size</option>
                <option value="3">3 x 3</option>
                <option value="4">4 x 4</option>
                <option value="5">5 x 5</option>
            </select>
        </div>
        <div class="options-menu">
            <label for="boardSize">Game mode : </label>
            <select id="mode">
                <option value="" disabled selected>Select the game mode</option>
                <option value="stantard">stantard</option>
                <option value="precision">precision</option>
            </select>
        </div>
        </form>
        <div class="btns" id="board">
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
            <button></button>
        </div>

        <button id="startGame" class="btn-primary">Start The Game</button>

        <div class="results-card">
            <h3>Result Summary</h3>
            <div class="stats-grid">
                <p id="totalAttemps">Total attempts: 0</p>
                <p id="correctClick">Correct clicks: 0</p>
                <p id="missClick">Miss clicks: 0</p>
                <p id="ignoredClick">ignored clicks: 0</p>
                <p id="clickPerSecond"></p>
            </div>
        </div>
    </div>

    <script src="/js/index.js"></script>
</body>

</html>
